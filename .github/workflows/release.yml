name: Release

# Push a tag like v0.1.0 to publish a GitHub release with prebuilt binaries
# (see .goreleaser.yaml). The release notes are the matching CHANGELOG.md
# section, so rename `## [Unreleased]` to the version before tagging.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs the tags and history

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Extract release notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.3 # keep in sync with GORELEASER_VERSION in the Makefile
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lets users check where a download came from:
      #   gh attestation verify <archive> --repo ckoehn/helm-values-tidy
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
