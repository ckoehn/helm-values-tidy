name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: make vet

      - name: Test
        run: go test -race -coverprofile=cover.out ./...

      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: make build

      - name: Smoke test against bundled chart
        run: ./bin/helm-values-tidy -o json -f testdata/values.yaml testdata/parent

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Uses the Makefile's pinned golangci-lint, built with the same Go
      # toolchain, so CI and local runs behave identically.
      - name: golangci-lint
        run: make lint
