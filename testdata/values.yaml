# `make demo` runs with: --free-form nodeSelector --free-form '*.labels'
replicaCount: 3            # changed
image:
  repository: nginx        # redundant
  tag: "1.25"              # redundant
  pullPolicy: Always       # changed
  pulPolicy: Always        # unknown (typo)
podAnnotations:
  example.com/foo: bar     # free-form, ok
nodeSelector:
  kubernetes.io/os: linux  # redundant (still reported under --free-form)
  disktype: ssd            # free-form via --free-form nodeSelector, ok
ports: [80, 443]           # redundant (list)
extra:
  anything: goes           # null default, ok
global:
  region: eu               # redundant
  storageClass: fast       # changed (subchart global)
db:
  enabled: true            # changed
  port: 5433               # redundant (parent override)
  user: admin              # redundant (subchart default)
  password: secret         # unknown
  labels:
    app: child             # redundant
    team: data             # free-form via --free-form '*.labels', ok
legacyKey: 1               # unknown
resources: null            # null removes default, skipped
